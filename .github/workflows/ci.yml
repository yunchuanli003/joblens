name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖（仅测试用）
        run: npm ci
      - name: 自检 + 四套测试
        run: npm run verify
      - name: 打包
        run: npm run build
      - name: 上传可加载的扩展包
        uses: actions/upload-artifact@v4
        with:
          name: joblens-unpacked
          path: dist/unpacked
